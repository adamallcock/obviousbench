[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obviousbench"
version = "0.2.0"
description = "A lightweight Inspect AI benchmark for obvious public-facing LLM failures."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "anthropic>=0.105,<1",
  "google-genai>=1.53,<2",
  # Inspect 0.3.259 and OpenAI 3.1 migrate the compatible-provider stack to HTTPX2.
  "inspect-ai>=0.3.259,<0.3.260",
  "openai>=3.1,<4",
  # ObviousBench's Cohere and Bedrock providers use legacy HTTPX directly.
  "httpx>=0.28,<1",
  "pydantic>=2.13,<3",
  "pyyaml>=6.0.3",
  # Inspect 0.3.259 uses the xAI 1.18 enum for native xhigh reasoning effort.
  "xai_sdk>=1.18,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "ruff>=0.15",
]

[project.scripts]
obviousbench = "obviousbench.cli:main"

[project.entry-points.inspect_ai]
obviousbench = "obviousbench._registry"

[tool.setuptools.packages.find]
include = ["obviousbench*"]

[tool.pytest.ini_options]
markers = [
  "provider: tests that call external model providers",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
